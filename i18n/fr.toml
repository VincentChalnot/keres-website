[cgu_title]
  other = "Conditions Générales d'Utilisation"
[cgu_subtitle]
  other = "Dernière mise à jour : 28 septembre 2026 – Applicables à l'utilisation de la plateforme de jeu en ligne Keres."
[cgu_object_title]
  other = "Objet"
[cgu_object_text]
  other = "Les présentes Conditions Générales d'Utilisation (CGU) régissent l'accès et l'utilisation de la plateforme de jeu en ligne Keres, éditée par Vincent Chalnot (voir nos mentions légales), accessible notamment depuis playkeres.com et app.playkeres.com. Le jeu contre l'ordinateur ou en mode « hot-seat » (à deux joueurs sur un même appareil) est accessible sans création de compte. La création d'un compte est nécessaire pour accéder aux fonctionnalités en ligne : recherche de partie, parties classées, amis et notifications. L'utilisation de la plateforme implique l'acceptation pleine et entière des présentes CGU."
[cgu_account_title]
  other = "Compte utilisateur"
[cgu_account_text]
  other = "La création d'un compte nécessite une adresse e-mail valide et un mot de passe, ou une connexion via un fournisseur d'identité tiers (Google, Discord). Vous êtes responsable de la confidentialité de vos identifiants et de toute activité effectuée depuis votre compte. Le nom d'utilisateur affiché publiquement peut être modifié une fois tous les douze mois."
[cgu_conduct_title]
  other = "Comportement des utilisateurs"
[cgu_conduct_text]
  other = "Vous vous engagez à utiliser la plateforme de bonne foi : ne pas recourir à une assistance extérieure non autorisée pour jouer à votre place, ne pas perturber le fonctionnement du service, et ne pas adopter de comportement abusif ou injurieux envers les autres joueurs. Tout manquement peut entraîner la suspension ou la suppression du compte concerné."
[cgu_ip_title]
  other = "Propriété intellectuelle"
[cgu_ip_text]
  other = "Le jeu Keres, ses règles, son moteur de jeu, son interface et l'ensemble des contenus de la plateforme sont la propriété exclusive de Vincent Chalnot, sauf mention contraire, et sont protégés par le droit d'auteur. Toute reproduction ou réutilisation non autorisée est interdite."
[cgu_availability_title]
  other = "Disponibilité du service"
[cgu_availability_text]
  other = "La plateforme est fournie « en l'état », gratuitement, sans garantie de disponibilité permanente. Vincent Chalnot se réserve le droit de modifier, suspendre ou interrompre tout ou partie du service à tout moment, notamment pour des raisons de maintenance, sans que cela n'ouvre droit à indemnité."
[cgu_termination_title]
  other = "Suppression de compte"
[cgu_termination_text1]
  other = "Vous pouvez demander la suppression de votre compte à tout moment en nous contactant via notre"
[cgu_contact_link]
  other = "formulaire de contact"
[cgu_termination_text2]
  other = ". Le traitement de vos données à la suite d'une suppression de compte, notamment la conservation anonymisée de l'historique de vos parties, est décrit dans notre"
[cgu_privacy_link]
  other = "politique de confidentialité"
[cgu_liability_title]
  other = "Responsabilité"
[cgu_liability_text]
  other = "La plateforme étant fournie gratuitement, la responsabilité de Vincent Chalnot ne saurait être engagée qu'en cas de faute prouvée, et dans les limites autorisées par la loi. Vincent Chalnot ne garantit pas que le service sera exempt d'erreurs ou d'interruptions."
[cgu_law_title]
  other = "Droit applicable et litiges"
[cgu_law_text1]
  other = "Les présentes CGU sont soumises au droit français. En cas de litige, une solution amiable sera recherchée en priorité."
[cgu_law_text2]
  other = "Conformément aux dispositions du Code de la consommation concernant la médiation de la consommation, vous pouvez recourir gratuitement à un médiateur de la consommation en vue de la résolution amiable d'un litige."
[cgu_law_text3]
  other = "Pour en savoir plus :"
[privacy_title]
  other = "Politique de confidentialité"
[privacy_subtitle]
  other = "Dernière mise à jour : 28 septembre 2026"
[privacy_controller_title]
  other = "Responsable du traitement"
[privacy_controller_text]
  other = "Le responsable du traitement des données décrites ci-dessous est Vincent Chalnot. Son identité complète et ses coordonnées figurent dans nos"
[privacy_legal_notice_link]
  other = "mentions légales"
[privacy_data_title]
  other = "Données collectées"
[privacy_data_text]
  other = "Dans le cadre de la création d'un compte et de l'utilisation de la plateforme de jeu en ligne, nous collectons : votre adresse e-mail et, le cas échéant, les informations transmises par le fournisseur d'identité tiers utilisé pour vous connecter (Google, Discord) ; un nom d'utilisateur public ; l'historique de vos parties (coups joués, résultats, statistiques de classement) ; les messages que vous nous adressez via le formulaire de contact. La navigation sur le site ne collecte aucune autre donnée personnelle en dehors du cookie de session décrit ci-dessous."
[privacy_cookies_title]
  other = "Cookies"
[privacy_cookies_text]
  other = "La plateforme Keres utilise uniquement un cookie de session strictement nécessaire à l'authentification et au maintien de votre connexion. Aucun cookie de mesure d'audience, de publicité ou de traçage n'est déposé. Ce cookie étant strictement nécessaire au fonctionnement du service, aucun consentement préalable ni bandeau de consentement n'est requis."
[privacy_purpose_title]
  other = "Finalités et base légale"
[privacy_purpose_text]
  other = "Ces données sont traitées pour permettre la création et la gestion de votre compte, le déroulement des parties, le classement, la mise en relation avec d'autres joueurs, ainsi que pour répondre à vos demandes de contact. Ces traitements sont fondés sur l'exécution du contrat qui vous lie à Keres lors de la création de votre compte, ainsi que sur notre intérêt légitime à assurer le bon fonctionnement et la sécurité de la plateforme."
[privacy_retention_title]
  other = "Durée de conservation"
[privacy_retention_text1]
  other = "Vos données de compte sont conservées tant que votre compte reste actif."
[privacy_retention_text2]
  other = "Si votre compte est supprimé à votre demande, vos données personnelles sont effacées. Les parties que vous avez jouées sont en revanche conservées, mais sous une forme rendue définitivement anonyme : le lien entre votre compte et ces parties est irrémédiablement rompu, sans qu'aucune correspondance ne puisse être reconstituée. Ces données de parties anonymisées peuvent être utilisées à des fins d'analyse et d'entraînement de modèles d'intelligence artificielle liés au moteur de jeu."
[privacy_recipients_title]
  other = "Destinataires des données"
[privacy_recipients_text1]
  other = "Vos données peuvent être transmises aux prestataires techniques qui nous permettent d'opérer la plateforme (hébergement, calcul pour l'intelligence artificielle, envoi d'e-mails), énumérés dans nos"
[privacy_recipients_text2]
  other = "Ces prestataires n'utilisent vos données que pour l'exécution des services qu'ils nous fournissent."
[privacy_rights_title]
  other = "Vos droits"
[privacy_rights_text1]
  other = "Conformément au Règlement Général sur la Protection des Données (RGPD), vous disposez d'un droit d'accès, de rectification, d'effacement et de portabilité de vos données, ainsi que d'un droit d'opposition et de limitation du traitement."
[privacy_rights_text2]
  other = "Pour exercer ces droits, utilisez les boutons de demande dédiés dans Paramètres → Confidentialité de votre compte (pour l'export de données ou la suppression de compte), ou contactez-nous via notre"
[privacy_contact_link]
  other = "formulaire de contact"
[privacy_rights_text3]
  other = ". Nous nous engageons à répondre à votre demande dans un délai maximal de 30 jours."
[privacy_rights_text4]
  other = "En cas de litige, vous pouvez également introduire une réclamation auprès de la"
[privacy_changes_title]
  other = "Modification de la présente politique"
[privacy_changes_text]
  other = "Cette politique de confidentialité peut être mise à jour ponctuellement. La date de dernière mise à jour figure en haut de cette page."
