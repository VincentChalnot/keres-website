[cgu_title]
  other = "Terms of Use"
[cgu_subtitle]
  other = "Last updated: September 28, 2026 – Applicable to the use of the Keres online game platform."
[cgu_object_title]
  other = "Purpose"
[cgu_object_text]
  other = "These Terms of Use govern access to and use of the Keres online game platform, published by Vincent Chalnot (see our legal notice), available notably from playkeres.com and app.playkeres.com. Playing against the computer or in \"hot-seat\" mode (two players on the same device) is available without creating an account. Creating an account is required to access online features: matchmaking, rated games, friends and notifications. Using the platform implies full and unconditional acceptance of these Terms of Use."
[cgu_account_title]
  other = "User Account"
[cgu_account_text]
  other = "Creating an account requires a valid email address and password, or signing in via a third-party identity provider (Google, Discord). You are responsible for keeping your credentials confidential and for any activity carried out from your account. Your publicly displayed username may be changed once every twelve months."
[cgu_conduct_title]
  other = "User Conduct"
[cgu_conduct_text]
  other = "You agree to use the platform in good faith: not to rely on unauthorized external assistance to play on your behalf, not to disrupt the operation of the service, and not to engage in abusive or insulting behavior towards other players. Any breach may result in the suspension or deletion of the account concerned."
[cgu_ip_title]
  other = "Intellectual Property"
[cgu_ip_text]
  other = "The game Keres, its game engine, its interface and all content on the platform are the exclusive property of Vincent Chalnot, unless otherwise stated, and are protected by copyright. Any unauthorized reproduction or reuse is prohibited."
[cgu_availability_title]
  other = "Service Availability"
[cgu_availability_text]
  other = "The platform is provided \"as is\", free of charge, without any guarantee of permanent availability. Vincent Chalnot reserves the right to modify, suspend or discontinue all or part of the service at any time, notably for maintenance purposes, without this giving rise to any compensation."
[cgu_termination_title]
  other = "Account Deletion"
[cgu_termination_text1]
  other = "You may request the deletion of your account at any time by contacting us via our"
[cgu_contact_link]
  other = "contact form"
[cgu_termination_text2]
  other = ". How your data is handled following account deletion, in particular the anonymized retention of your game history, is described in our"
[cgu_privacy_link]
  other = "privacy policy"
[cgu_liability_title]
  other = "Liability"
[cgu_liability_text]
  other = "As the platform is provided free of charge, Vincent Chalnot's liability can only be engaged in the event of proven fault, and within the limits permitted by law. Vincent Chalnot does not guarantee that the service will be free of errors or interruptions."
[cgu_law_title]
  other = "Applicable Law and Disputes"
[cgu_law_text1]
  other = "These Terms of Use are governed by French law. In case of dispute, an amicable solution will be sought first."
[cgu_law_text2]
  other = "In accordance with the provisions of the French Consumer Code concerning consumer mediation, you may use a consumer mediator free of charge for the amicable resolution of a dispute."
[cgu_law_text3]
  other = "To learn more:"
[privacy_title]
  other = "Privacy Policy"
[privacy_subtitle]
  other = "Last updated: September 28, 2026"
[privacy_controller_title]
  other = "Data Controller"
[privacy_controller_text]
  other = "The controller for the data described below is Vincent Chalnot. Their full identity and contact details are listed in our"
[privacy_legal_notice_link]
  other = "legal notice"
[privacy_data_title]
  other = "Data We Collect"
[privacy_data_text]
  other = "As part of creating an account and using the online game platform, we collect: your email address and, where applicable, the information provided by the third-party identity provider used to sign in (Google, Discord); a public username; your game history (moves played, results, rating statistics); and any messages you send us via the contact form. Browsing the site does not collect any other personal data beyond the session cookie described below."
[privacy_cookies_title]
  other = "Cookies"
[privacy_cookies_text]
  other = "The Keres platform only uses a session cookie strictly necessary for authentication and keeping you signed in. No audience-measurement, advertising or tracking cookies are deposited. As this cookie is strictly necessary for the service to function, no prior consent or consent banner is required."
[privacy_purpose_title]
  other = "Purposes and Legal Basis"
[privacy_purpose_text]
  other = "This data is processed to enable the creation and management of your account, the running of games, rating, matching you with other players, and responding to your contact requests. These processing activities are based on the performance of the contract formed when you create your account, as well as on our legitimate interest in ensuring the proper functioning and security of the platform."
[privacy_retention_title]
  other = "Retention Period"
[privacy_retention_text1]
  other = "Your account data is retained for as long as your account remains active."
[privacy_retention_text2]
  other = "When your account is deleted at your request, your personal data is erased. The games you have played, however, are retained, but in a permanently anonymized form: the link between your account and those games is irrevocably severed, with no recoverable mapping. This anonymized game data may be used for analysis and to train artificial intelligence models related to the game engine."
[privacy_recipients_title]
  other = "Data Recipients"
[privacy_recipients_text1]
  other = "Your data may be shared with the technical providers that allow us to operate the platform (hosting, artificial intelligence compute, email delivery), listed in our"
[privacy_recipients_text2]
  other = "These providers only use your data to perform the services they provide to us."
[privacy_rights_title]
  other = "Your Rights"
[privacy_rights_text1]
  other = "In accordance with the General Data Protection Regulation (GDPR), you have the right to access, rectify, erase and port your data, as well as the right to object and to restrict processing."
[privacy_rights_text2]
  other = "To exercise these rights, use the dedicated request buttons in your account's Settings → Privacy page (for data export or account deletion) or contact us via our"
[privacy_contact_link]
  other = "contact form"
[privacy_rights_text3]
  other = ". We commit to responding to your request within a maximum of 30 days."
[privacy_rights_text4]
  other = "In case of dispute, you may also file a complaint with the"
[privacy_changes_title]
  other = "Changes to This Policy"
[privacy_changes_text]
  other = "This privacy policy may be updated from time to time. The date of the last update appears at the top of this page."
