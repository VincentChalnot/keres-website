<svg xmlns="http://www.w3.org/2000/svg" class="hidden" aria-hidden="true">
  <symbol id="i-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17M11 6h10M11 12h10M11 18h10"/></symbol>
  <symbol id="i-king" viewBox="0 0 24 24" fill="currentColor"><path d="M11 2h2v2h2v2h-2v2.2c3.4.8 6 3.7 6 7.3V19H3v-3.5c0-3.6 2.6-6.5 6-7.3V6H9V4h2zM4 20h16v2H4z"/></symbol>
  <symbol id="i-login" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M15 12H3"/></symbol>
</svg>
<nav class="navbar" aria-label="{{ i18n "nav_main" }}">
  <div class="container-page navbar__inner">
    <div class="navbar__brand">
      <a class="navbar__logo" href="{{ "" | relLangURL }}" aria-label="{{ i18n "nav_home" }}">
        <img src="/logo.svg" alt="" width="32" height="32" aria-hidden="true">
        <span class="navbar__logo-text">Keres</span>
      </a>
      <button class="navbar__burger" type="button" aria-label="{{ i18n "nav_menu" }}" aria-expanded="false" aria-controls="navbar-menu" data-burger><span></span><span></span><span></span><span></span></button>
    </div>

    <div class="navbar__menu" id="navbar-menu">
      <div class="navbar__start">
        {{ with .Site.GetPage "/rules" }}
        <a href="{{ .RelPermalink }}" class="navbar__link"><svg class="navbar__icon is-mobile-only" aria-hidden="true"><use href="#i-list"/></svg><span>{{ i18n "nav_rules" }}</span></a>
        {{ end }}
      </div>

      <div class="navbar__end">
        <a href="{{ partial "platform-url.html" . }}" class="btn btn--primary btn--sm navbar__link navbar__play" target="_blank" rel="noopener"><svg class="navbar__icon is-mobile-only" aria-hidden="true"><use href="#i-king"/></svg><span>{{ i18n "nav_play" }}</span></a>

        {{ partial "lang-switch.html" . }}

        <a href="{{ partial "platform-url.html" . }}/login" class="btn btn--outline btn--sm navbar__link navbar__ghost"><svg class="navbar__icon" aria-hidden="true"><use href="#i-login"/></svg><span>{{ i18n "nav_login" }}</span></a>
      </div>
    </div>
  </div>
</nav>

<script>
  document.querySelectorAll("[data-burger]").forEach(function (burger) {
    burger.addEventListener("click", function () {
      var open = !burger.classList.contains("is-active");
      burger.classList.toggle("is-active", open);
      burger.setAttribute("aria-expanded", open);
      document.getElementById(burger.getAttribute("aria-controls")).classList.toggle("is-active", open);
    });
  });
</script>
