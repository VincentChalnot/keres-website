<div class="piece-card">
  <div class="piece-card__name"><i class="piece-icon piece-icon--primary piece-icon--{{ .key }}"></i> {{ .name }} ({{ .symbol }})</div>
  <img src="/images/movesets/{{ .image }}.svg" alt="{{ .name }} moves" />
  <p class="piece-card__desc">
    {{ .movement }}<br>
    {{ if .note }}<strong>{{ .note }}</strong>{{ end }}
  </p>
</div>
