{{ define "title" }}{{ .Title }}{{ end }}

{{ define "main" }}
  <section class="section">
    <div class="container-page max-w-2xl">
      <h1 class="page-title mb-6">{{ .Title }}</h1>

      <div id="contact-status" class="alert" role="status" hidden></div>

      <form id="contact-form">
        <!-- Honeypot: must stay empty -->
        <div class="hidden" aria-hidden="true">
          <label>Website (leave empty)
            <input type="text" name="website" tabindex="-1" autocomplete="off" />
          </label>
        </div>

        <div class="field">
          <label class="label" for="name">{{ i18n "contact_name" }}</label>
          <input class="input" type="text" id="name" name="name" required />
        </div>

        <div class="field">
          <label class="label" for="email">{{ i18n "contact_email" }}</label>
          <input class="input" type="email" id="email" name="email" required />
        </div>

        <div class="field">
          <label class="label" for="subject">{{ i18n "contact_subject" }}</label>
          <input class="input" type="text" id="subject" name="subject" required />
        </div>

        <div class="field">
          <label class="label" for="message">{{ i18n "contact_message" }}</label>
          <textarea class="textarea" id="message" name="message" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn btn--primary">
          {{ i18n "contact_send" }}
        </button>
      </form>
    </div>
  </section>

  <script>
  (function () {
    var endpoint = {{ printf "%s/api/contact" (partial "platform-url.html" $) | jsonify | safeJS }};
    var form = document.getElementById("contact-form");
    var status = document.getElementById("contact-status");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      status.hidden = true;

      var payload = {
        name:    form.name.value,
        email:   form.email.value,
        subject: form.subject.value,
        message: form.message.value,
        website: form.website.value,   // honeypot
      };

      try {
        var res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          status.textContent = {{ i18n "contact_success" | jsonify | safeJS }};
          status.className = "alert alert--success";
          form.reset();
        } else {
          status.textContent = {{ i18n "contact_error" | jsonify | safeJS }};
          status.className = "alert alert--danger";
        }
      } catch (err) {
        status.textContent = {{ i18n "contact_error" | jsonify | safeJS }};
        status.className = "alert alert--danger";
      }
      status.hidden = false;
    });
  })();
  </script>
{{ end }}
