{{ define "title" }}{{ .Title }}{{ end }}

{{ define "main" }}
  <section class="section">
    <div class="container-page max-w-2xl">
      <h1 class="page-title mb-6">{{ i18n "waitlist_title" }}</h1>

      <div class="section__img mb-6">
        <img src="/images/real_board_full.webp" alt="The Keres board, physical prototype" />
      </div>

      <p class="mb-6">{{ i18n "waitlist_intro" }}</p>

      <div id="waitlist-status" class="alert" role="status" hidden></div>

      <form id="waitlist-form">
        <!-- Honeypot: must stay empty -->
        <div class="hidden" aria-hidden="true">
          <label>Website (leave empty)
            <input type="text" name="website" tabindex="-1" autocomplete="off" />
          </label>
        </div>

        <div class="field">
          <label class="label" for="email">{{ i18n "waitlist_email_label" }}</label>
          <input class="input" type="email" id="email" name="email" required />
        </div>

        <div class="field">
          <label class="label" for="name">{{ i18n "waitlist_name_label" }}</label>
          <input class="input" type="text" id="name" name="name" />
        </div>

        <div class="field">
          <label class="label" for="note">{{ i18n "waitlist_note_label" }}</label>
          <textarea class="textarea" id="note" name="note" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn--primary">
          {{ i18n "waitlist_submit" }}
        </button>
      </form>
    </div>
  </section>

  <script>
  (function () {
    var endpoint = {{ printf "%s/api/waitlist" (partial "platform-url.html" $) | jsonify | safeJS }};
    var form = document.getElementById("waitlist-form");
    var status = document.getElementById("waitlist-status");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      status.hidden = true;

      var payload = {
        email:   form.email.value,
        name:    form.name.value,
        note:    form.note.value,
        website: form.website.value,   // honeypot
      };

      try {
        var res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (res.ok) {
          status.textContent = {{ i18n "waitlist_success" | jsonify | safeJS }};
          status.className = "alert alert--success";
          form.reset();
        } else {
          status.textContent = {{ i18n "waitlist_error" | jsonify | safeJS }};
          status.className = "alert alert--danger";
        }
      } catch (err) {
        status.textContent = {{ i18n "waitlist_error" | jsonify | safeJS }};
        status.className = "alert alert--danger";
      }
      status.hidden = false;
    });
  })();
  </script>
{{ end }}
